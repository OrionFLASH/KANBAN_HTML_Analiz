<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KANBAN Analiz — дашборд</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button type="button" class="panel-toggle" id="toggleLeft" title="Настройки">☰</button>
      <div class="brand">
        <h1>KANBAN Analiz</h1>
        <p id="metaInfo">Загрузите JSON-отчёт из OUT/</p>
      </div>
      <button type="button" class="panel-toggle" id="toggleRight" title="Фильтры">⚙</button>
    </header>

    <aside class="panel panel-left" id="settingsPanel">
      <div class="panel-head">
        <h2>Настройки</h2>
        <button type="button" class="panel-close" data-panel="left">×</button>
      </div>
      <div class="panel-body">
        <label class="field">
          <span>Загрузка JSON</span>
          <input type="file" id="jsonFile" accept=".json,application/json">
        </label>
        <label class="field">
          <span>Режим графика</span>
          <select id="chartMode">
            <option value="by_product">Линии по продуктам (выбранное ТБ)</option>
            <option value="by_tb">Линии по ТБ (выбранный продукт)</option>
          </select>
        </label>
        <label class="field">
          <span>Метрика</span>
          <select id="metricSelect"></select>
        </label>
        <label class="field">
          <span>Показатель (матрица)</span>
          <select id="indicatorSelect"></select>
        </label>
        <label class="field">
          <span>Макс. линий на графике</span>
          <input type="number" id="maxSeries" min="1" max="30" value="8">
        </label>
        <label class="field checkbox">
          <input type="checkbox" id="showLegend" checked>
          <span>Показывать легенду</span>
        </label>
        <label class="field checkbox">
          <input type="checkbox" id="smoothLines">
          <span>Сглаживание линий</span>
        </label>
        <div class="hint">
          Ось X — число лидов (накопительно по возрастанию срока). Ось Y — дней (целые).
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="tabs">
        <button type="button" class="tab active" data-tab="charts">Графики</button>
        <button type="button" class="tab" data-tab="pivot">Сводная матрица</button>
      </div>

      <section id="chartsTab" class="tab-panel active">
        <div id="chartsGrid" class="charts-grid">
          <div class="empty-state">
            <p>Загрузите файл <code>kanban_report_*.json</code> слева.</p>
            <p>Будут построены кривые «лиды × дни» по выбранному срезу.</p>
          </div>
        </div>
      </section>

      <section id="pivotTab" class="tab-panel">
        <div class="pivot-toolbar">
          <span id="pivotCaption">Свод: продукт × стадия</span>
        </div>
        <div class="table-wrap">
          <table id="pivotTable" class="pivot-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <aside class="panel panel-right" id="filtersPanel">
      <div class="panel-head">
        <h2>Фильтры</h2>
        <button type="button" class="panel-close" data-panel="right">×</button>
      </div>
      <div class="panel-body">
        <label class="field">
          <span>ТБ</span>
          <select id="tbFilter"></select>
        </label>
        <label class="field">
          <span>Группа продукта</span>
          <select id="groupFilter">
            <option value="">Все группы</option>
          </select>
        </label>
        <label class="field">
          <span>Продукт</span>
          <select id="productFilter">
            <option value="">Все продукты</option>
          </select>
        </label>
        <label class="field">
          <span>Стадия (статус)</span>
          <select id="stageFilter">
            <option value="">Все стадии</option>
          </select>
        </label>
        <label class="field">
          <span>Уровень анализа</span>
          <select id="levelFilter">
            <option value="">Любой</option>
            <option value="status">status</option>
            <option value="substage">substage</option>
          </select>
        </label>
        <button type="button" class="btn secondary" id="resetFilters">Сбросить фильтры</button>
        <div class="stats-box" id="filterStats"></div>
      </div>
    </aside>
  </div>

  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/pivot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
